<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16282d">
<title>cnation TD · 아르카 방어전</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cnation TD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Stylish";src:url("fonts/stylish.woff2?v=5") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:118%}
@font-face{font-family:"Gowun Dodum";src:url("fonts/gowun-dodum.woff2?v=5") format("woff2");font-weight:400;font-style:normal;font-display:swap;size-adjust:104%}
:root{--font-display:"Stylish",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--font-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--bg:#16282d;--panel:#1f373d;--panel2:#284850;--line:#3c636b;--ink:#eef4ea;--dim:#a9c0bb;--gold:#f2cf72;--good:#8fe5b4;--bad:#f08f7c;--accent:#8be1bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1a1e;color:var(--ink);font-family:var(--font-display);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;margin:0 auto;height:100dvh;max-width:520px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#hud{flex:none;display:flex;align-items:center;gap:5px;height:calc(42px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;background:var(--panel);border-bottom:1px solid var(--line);font-weight:400;font-size:15px}
#hud .stat{display:flex;align-items:center;gap:3px;padding:4px 6px;border-radius:8px;background:var(--bg);white-space:nowrap}
#hud .stat b{font-variant-numeric:tabular-nums}
#hudBattle{flex:1;text-align:center;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud button{flex:none;min-width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:13px}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;background:#c9dfc9}
#viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;padding:7px 14px;border-radius:999px;background:rgba(18,34,39,.88);font-size:14px;font-weight:400;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#banner.on{opacity:1}
#banner small{display:block;font-size:14px;letter-spacing:.2em;color:var(--gold)}
#banner strong{display:block;font-size:30px}
#aimHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:rgba(120,40,20,.9);font-weight:400;font-size:14px;display:none}
#strip{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;background:var(--panel);border-top:1px solid var(--line)}
#chips{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 8px;border-radius:8px;background:var(--bg);font-size:12px;white-space:nowrap}
.chip.elite{outline:1px solid var(--gold)}.chip.boss{background:#5a2a2a;outline:1px solid var(--bad)}
.chip i{font-style:normal;color:var(--accent)}.chip.info{background:var(--panel2);outline:1px solid var(--line)}#app.title #hud,#app.title #strip,#app.title #dock{visibility:hidden}
#startBtn{flex:none;height:34px;padding:0 12px;border:0;border-radius:9px;background:var(--gold);color:#2b2410;font:inherit;font-weight:400;font-size:14px}
#startBtn[hidden]{display:none}
#dock,#panel{flex:none;height:calc(126px + env(safe-area-inset-bottom));padding:5px 6px calc(5px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#dock{display:flex;flex-direction:column;gap:5px}
#dock .row{flex:1;min-height:0;display:flex;gap:5px;justify-content:center}
.card{position:relative;flex:1 1 0;max-width:76px;min-width:0;border:2px solid var(--line);border-radius:9px;background:var(--panel2);overflow:hidden;text-align:center;touch-action:none}
.card.hero{border-color:#8a7a45}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%;background:#35585f;pointer-events:none}
.card .nm{position:absolute;left:0;right:0;top:0;padding:1px 0;font-size:11px;line-height:13px;white-space:nowrap;overflow:hidden;background:rgba(14,26,30,.62)}
.card .ct{position:absolute;left:0;right:0;bottom:0;padding:1px 0;font-size:12px;line-height:14px;color:var(--gold);background:rgba(14,26,30,.78)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,207,114,.4)}
.card.off img{opacity:.4}.card.off .ct{color:var(--bad)}
.card.out .ct{color:var(--good)}
.card .ub{position:absolute;left:3px;right:3px;bottom:16px;height:4px;border-radius:2px;background:rgba(10,20,24,.7);overflow:hidden}.card .ub i{display:block;height:100%;background:#ff9a3c}
.card.ult{border-color:#ffb35c;animation:ultPulse .9s ease-in-out infinite}.card.ult .ct{color:#2b1a05;background:#ffb35c}.card.ult .ub i{background:#ffd257}
@keyframes ultPulse{0%,100%{box-shadow:0 0 0 2px rgba(255,170,80,.35)}50%{box-shadow:0 0 0 5px rgba(255,170,80,.8),0 0 14px rgba(255,200,90,.8)}}
.card .cool{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,24,.72);font-size:20px}
#panel{display:none;gap:8px}
#app.unit-open #panel{display:flex}#app.unit-open #dock{display:none}
#panel img{flex:none;width:64px;height:100%;max-height:88px;object-fit:cover;object-position:50% 12%;border-radius:10px;background:#35585f}
#panel .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
#panel h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel h3 span{color:var(--gold);letter-spacing:1px}#panel h3 em{font-style:normal;color:var(--bad);font-size:12px}
#panel p{margin:0;font-family:var(--font-body);font-size:11.5px;line-height:1.35;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#panel p.next{color:var(--accent)}
#panel .btns{display:flex;gap:5px}
#panel button{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:12.5px;font-weight:400;white-space:nowrap;padding:0 4px}
#panel button.primary{background:var(--gold);border-color:var(--gold);color:#2b2410}
#panel button.ult{background:#b4533a;border-color:#e48a6a}
#panel button:disabled{opacity:.45}
#panel button.x{flex:none;width:34px}
#modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,16,19,.72)}
#modal[hidden]{display:none}
#modal.title{background:linear-gradient(#1c3a40,#0f1f24)}
.sheet{width:100%;max-width:420px;max-height:92%;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:center;touch-action:pan-y}
.sheet h1{margin:0 0 2px;font-size:30px;letter-spacing:.02em}.sheet h1 em{font-style:normal;color:var(--gold)}
.sheet h2{margin:0 0 8px;font-size:20px}
.sheet p{margin:6px 0;color:var(--dim);font-family:var(--font-body);font-size:14px;line-height:1.5}.sheet p.sub,.sheet p.who,.sheet p.line,.sheet p.stars,.sheet p.tag{font-family:var(--font-display)}.sheet p.tag{font-size:20px;color:var(--ink);margin:0 0 6px}
.sheet .sub{color:var(--accent);letter-spacing:.25em;font-size:12px}
.sheet button{display:block;width:100%;margin-top:10px;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--ink);font:inherit;font-size:15px;font-weight:400;padding:8px 10px}
.sheet button.primary{background:var(--gold);border-color:var(--gold);color:#2b2410}
.sheet button small{display:block;font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--dim);margin-top:2px}.sheet button.primary small{color:#5b4c1f}.sheet button:disabled{opacity:.4}.sheet button.dev{border-style:dashed;color:var(--bad);min-height:38px;font-size:13px}.sheet .seg{display:flex;gap:6px}.sheet .seg button{margin-top:0;min-height:40px}.sheet ul.foes{list-style:none;padding:0}.sheet ul.foes li{margin-bottom:8px}.sheet ul.foes b{color:var(--ink);font-family:var(--font-display);font-weight:400}.sheet ul.foes i{font-style:normal;color:var(--accent)}
.sheet .stars{font-size:34px;color:var(--gold);letter-spacing:6px}
.sheet .who{color:var(--gold);font-weight:400;font-size:15px}
.sheet .line{font-size:16px;color:var(--ink);min-height:4.5em}
.sheet ul{margin:8px 0;padding:0 0 0 18px;text-align:left;color:var(--dim);font-family:var(--font-body);font-size:13.5px;line-height:1.6}
.sheet h3.tips-h{margin:16px 0 6px;font-size:18px;color:var(--gold);text-align:left}
#modal.help .sheet{text-align:left}#modal.help .sheet h2{text-align:center}
.sheet details{margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.sheet summary{padding:10px 12px;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.sheet summary::-webkit-details-marker{display:none}.sheet summary::after{content:'▾';color:var(--dim)}.sheet details[open] summary::after{content:'▴'}
.sheet details[open] summary{border-bottom:1px solid var(--line);color:var(--gold)}
.sheet .tip{padding:6px 10px 10px;font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--dim)}
.sheet .tip ul{margin:6px 0;padding-left:16px}.sheet .tip p{margin:6px 0;font-size:13px}.sheet .tip b{color:var(--ink);font-weight:400;font-family:var(--font-display);font-size:14px}
.sheet .tip b.y{color:#ffd257}.sheet .tip b.g{color:#9fb0b6}.sheet .tip i{font-style:normal;color:var(--accent)}.sheet .tip small{font-size:12px;color:#8fa9a4}
.sheet .tip table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12.5px}.sheet .tip th{color:var(--gold);font-weight:400;font-family:var(--font-display);text-align:left;padding:4px 5px;border-bottom:1px solid var(--line)}
.sheet .tip td{padding:4px 5px;border-bottom:1px solid rgba(60,99,107,.45);vertical-align:top}.sheet .tip td:first-child{white-space:nowrap;color:var(--ink)}
.sheet .unit{margin:8px 0 12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}.sheet .unit .uh{margin:0;color:var(--ink);font-size:13px}
.sheet .tip ul.ranks{list-style:none;padding:0}.sheet .tip ul.ranks li{margin:3px 0}.sheet .rk{display:inline-block;min-width:26px;color:var(--gold);font-family:var(--font-display)}
.sheet p.scope{margin:6px 0 10px;padding:7px 10px;border-radius:9px;font-family:var(--font-display);font-size:15px}
.sheet p.scope.now{background:rgba(111,208,255,.12);color:#9fdcff;border:1px dashed rgba(111,208,255,.55)}
.sheet p.scope.keep{background:rgba(242,207,114,.14);color:var(--gold);border:1px solid rgba(242,207,114,.6)}
#modal.legacy .sheet{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,207,114,.25)}#modal.legacy .sheet button{border-color:rgba(242,207,114,.5)}#modal.legacy .sheet button.cur{background:#4a3f1f}
#modal.bless .sheet{border-color:#6fd0ff}.chip.bless{outline:1px dashed rgba(111,208,255,.6)}
.ver{margin-top:12px;font-size:11px;color:#6f8b88}
</style>
</head>
<body>
<div id="app">
 <header id="hud">
  <div class="stat">♥ <b id="hudLife">20</b></div>
  <div class="stat">💰 <b id="hudGold">0</b></div>
  <div class="stat">👥 <b id="hudUnits">0/6</b></div>
  <div id="hudBattle"></div>
  <button id="menuBtn" aria-label="메뉴">☰</button>
  <button id="speedBtn" aria-label="배속">×1</button>
  <button id="pauseBtn" aria-label="일시정지">⏸</button>
 </header>
 <div id="viewport">
  <canvas id="gl"></canvas><canvas id="fx"></canvas>
  <div id="banner"><small></small><strong></strong></div>
  <div id="toast"></div>
  <div id="aimHint">떨어뜨릴 곳을 누르세요 · 취소하려면 아래 ×</div>
 </div>
 <div id="strip"><div id="chips"></div><button id="startBtn">전투 시작</button></div>
 <div id="dock"></div>
 <div id="panel"></div>
 <div id="modal" hidden></div>
</div>
<script src="vendor/three-r170.js"></script>
<script src="js/data.js?v=0.4.0"></script>
<script src="js/sim.js?v=0.4.0"></script>
<script src="js/models.js?v=0.4.0"></script>
<script src="js/game.js?v=0.4.0"></script>
