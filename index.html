<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16282d">
<title>cnation TD · 아르카 방어전</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#16282d;--panel:#1f373d;--panel2:#284850;--line:#3c636b;--ink:#eef4ea;--dim:#a9c0bb;--gold:#f2cf72;--good:#8fe5b4;--bad:#f08f7c;--accent:#8be1bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1a1e;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;margin:0 auto;height:100dvh;max-width:520px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#hud{flex:none;display:flex;align-items:center;gap:6px;height:calc(42px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
#hud .stat{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:var(--bg);white-space:nowrap}
#hud .stat b{font-variant-numeric:tabular-nums}
#hudBattle{flex:1;text-align:center;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud button{flex:none;min-width:40px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:13px}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;background:#c9dfc9}
#viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;padding:7px 14px;border-radius:999px;background:rgba(18,34,39,.88);font-size:14px;font-weight:700;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#banner.on{opacity:1}
#banner small{display:block;font-size:14px;letter-spacing:.2em;color:var(--gold)}
#banner strong{display:block;font-size:30px}
#aimHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:rgba(120,40,20,.9);font-weight:700;font-size:14px;display:none}
#strip{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;background:var(--panel);border-top:1px solid var(--line)}
#chips{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 8px;border-radius:8px;background:var(--bg);font-size:12px;white-space:nowrap}
.chip.elite{outline:1px solid var(--gold)}.chip.boss{background:#5a2a2a;outline:1px solid var(--bad)}
.chip i{font-style:normal;color:var(--dim)}
#startBtn{flex:none;height:34px;padding:0 12px;border:0;border-radius:9px;background:var(--gold);color:#2b2410;font:inherit;font-weight:800;font-size:14px}
#startBtn[hidden]{display:none}
#dock,#panel{flex:none;height:calc(100px + env(safe-area-inset-bottom));padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#dock{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.card{position:relative;flex:1 0 62px;max-width:92px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden;text-align:center;touch-action:none}
.card img{display:block;width:100%;height:52px;object-fit:cover;object-position:50% 12%;background:#35585f;pointer-events:none}
.card .nm{font-size:12px;font-weight:700;line-height:16px;white-space:nowrap;overflow:hidden}
.card .ct{font-size:12px;line-height:15px;color:var(--gold);font-weight:700}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,207,114,.35)}
.card.off img,.card.off .nm{opacity:.45}.card.off .ct{color:var(--bad)}
.card.out .ct{color:var(--good)}
.card .cool{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(10,20,24,.7);font-weight:800;font-size:18px}
.card .hero{position:absolute;left:3px;top:2px;font-size:11px;color:var(--gold);text-shadow:0 1px 2px #000}
#panel{display:none;gap:8px}
#app.unit-open #panel{display:flex}#app.unit-open #dock{display:none}
#panel img{flex:none;width:64px;height:100%;max-height:88px;object-fit:cover;object-position:50% 12%;border-radius:10px;background:#35585f}
#panel .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
#panel h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel h3 span{color:var(--gold);letter-spacing:1px}
#panel p{margin:0;font-size:11.5px;line-height:1.35;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#panel p.next{color:var(--accent)}
#panel .btns{display:flex;gap:5px}
#panel button{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;padding:0 4px}
#panel button.primary{background:var(--gold);border-color:var(--gold);color:#2b2410}
#panel button.ult{background:#b4533a;border-color:#e48a6a}
#panel button:disabled{opacity:.45}
#panel button.x{flex:none;width:34px}
#modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,16,19,.72)}
#modal[hidden]{display:none}
#modal.title{background:linear-gradient(#1c3a40,#0f1f24)}
.sheet{width:100%;max-width:420px;max-height:92%;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:center;touch-action:pan-y}
.sheet h1{margin:0 0 2px;font-size:30px;letter-spacing:.02em}.sheet h1 em{font-style:normal;color:var(--gold)}
.sheet h2{margin:0 0 8px;font-size:20px}
.sheet p{margin:6px 0;color:var(--dim);font-size:14px;line-height:1.5}
.sheet .sub{color:var(--accent);letter-spacing:.25em;font-size:12px}
.sheet button{display:block;width:100%;margin-top:10px;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:8px 10px}
.sheet button.primary{background:var(--gold);border-color:var(--gold);color:#2b2410}
.sheet button small{display:block;font-weight:400;font-size:12.5px;color:var(--dim);margin-top:2px}
.sheet .stars{font-size:34px;color:var(--gold);letter-spacing:6px}
.sheet .who{color:var(--gold);font-weight:800;font-size:15px}
.sheet .line{font-size:16px;color:var(--ink);min-height:4.5em}
.sheet ul{margin:8px 0;padding:0 0 0 18px;text-align:left;color:var(--dim);font-size:13.5px;line-height:1.6}
.ver{margin-top:12px;font-size:11px;color:#6f8b88}
</style>
</head>
<body>
<div id="app">
 <header id="hud">
  <div class="stat">♥ <b id="hudLife">20</b></div>
  <div class="stat">💰 <b id="hudGold">0</b></div>
  <div class="stat">👥 <b id="hudUnits">0/6</b></div>
  <div id="hudBattle"></div>
  <button id="speedBtn" aria-label="배속">×1</button>
  <button id="pauseBtn" aria-label="일시정지">⏸</button>
 </header>
 <div id="viewport">
  <canvas id="gl"></canvas><canvas id="fx"></canvas>
  <div id="banner"><small></small><strong></strong></div>
  <div id="toast"></div>
  <div id="aimHint">떨어뜨릴 곳을 누르세요 · 취소하려면 아래 ×</div>
 </div>
 <div id="strip"><div id="chips"></div><button id="startBtn">전투 시작</button></div>
 <div id="dock"></div>
 <div id="panel"></div>
 <div id="modal" hidden></div>
</div>
<script src="vendor/three-r170.js"></script>
<script src="js/data.js?v=0.1.0"></script>
<script src="js/sim.js?v=0.1.0"></script>
<script src="js/models.js?v=0.1.0"></script>
<script src="js/game.js?v=0.1.0"></script>
</body>
</html>
